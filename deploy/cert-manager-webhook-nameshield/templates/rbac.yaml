apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "nameshield-webhook.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app: {{ include "nameshield-webhook.name" . }}
    chart: {{ include "nameshield-webhook.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
---
# Grant the webhook permission to read the ConfigMap containing the Kubernetes
# apiserver's requestheader-ca-certificate.
# This ConfigMap is automatically created by the Kubernetes apiserver.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "nameshield-webhook.fullname" . }}:webhook-authentication-reader
  namespace: kube-system
  labels:
    app: {{ include "nameshield-webhook.name" . }}
    chart: {{ include "nameshield-webhook.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: extension-apiserver-authentication-reader
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: {{ include "nameshield-webhook.fullname" . }}
    namespace: {{ .Release.Namespace }}
---
# apiserver gets the auth-delegator role to delegate auth decisions to
# the core apiserver
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "nameshield-webhook.fullname" . }}:auth-delegator
  labels:
    app: {{ include "nameshield-webhook.name" . }}
    chart: {{ include "nameshield-webhook.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: {{ include "nameshield-webhook.fullname" . }}
    namespace: {{ .Release.Namespace }}
---
# Grant cert-manager permission to validate using our apiserver
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "nameshield-webhook.fullname" . }}:domain-solver
  labels:
    app: {{ include "nameshield-webhook.name" . }}
    chart: {{ include "nameshield-webhook.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
rules:
  - apiGroups:
      - {{ .Values.groupName }}
    resources:
      - '*'
    verbs:
      - 'create'
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "nameshield-webhook.fullname" . }}:domain-solver
  labels:
    app: {{ include "nameshield-webhook.name" . }}
    chart: {{ include "nameshield-webhook.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "nameshield-webhook.fullname" . }}:domain-solver
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: {{ .Values.certManager.serviceAccountName }}
    namespace: {{ .Values.certManager.namespace }}
---
# The webhook reads the Nameshield API token from a Secret referenced by the
# Issuer's solver configuration. By default it may only read Secrets of its
# own namespace (cert-manager ClusterIssuers resolve challenges in their
# cluster resource namespace). Set rbac.allowClusterWideSecretAccess to allow
# reading Secrets from any namespace, for Issuers living in other namespaces
# without an explicit namespace in apiTokenSecretRef.
{{- if .Values.rbac.allowClusterWideSecretAccess }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "nameshield-webhook.fullname" . }}:secret-reader
  labels:
    app: {{ include "nameshield-webhook.name" . }}
    chart: {{ include "nameshield-webhook.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
{{- else }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "nameshield-webhook.fullname" . }}:secret-reader
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app: {{ include "nameshield-webhook.name" . }}
    chart: {{ include "nameshield-webhook.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
{{- if .Values.rbac.allowClusterWideSecretAccess }}
kind: ClusterRoleBinding
metadata:
  name: {{ include "nameshield-webhook.fullname" . }}:secret-reader
{{- else }}
kind: RoleBinding
metadata:
  name: {{ include "nameshield-webhook.fullname" . }}:secret-reader
  namespace: {{ .Release.Namespace | quote }}
{{- end }}
  labels:
    app: {{ include "nameshield-webhook.name" . }}
    chart: {{ include "nameshield-webhook.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: {{ if .Values.rbac.allowClusterWideSecretAccess }}ClusterRole{{ else }}Role{{ end }}
  name: {{ include "nameshield-webhook.fullname" . }}:secret-reader
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: {{ include "nameshield-webhook.fullname" . }}
    namespace: {{ .Release.Namespace }}
