name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go vet and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test ./nameshield/...

  helm:
    name: Helm chart lint and render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: azure/setup-helm@v5.1.0

      - name: Lint chart
        run: helm lint deploy/cert-manager-webhook-nameshield

      - name: Render chart
        run: |
          helm template cert-manager-webhook-nameshield deploy/cert-manager-webhook-nameshield \
            --set image.repository=ghcr.io/${{ github.repository }} \
            --set image.tag=ci-${{ github.sha }} \
            --set image.pullPolicy=Always

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: docker/setup-buildx-action@v4.4.1

      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: ghcr.io/${{ github.repository }}:ci-${{ github.sha }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
