name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CHART_DIR: deploy/cert-manager-webhook-nameshield
  IMAGE: ghcr.io/${{ github.repository }}
  CHART_REPO_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

jobs:
  validate:
    name: Validate semver tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' is not a valid semantic version (expected vX.Y.Z, optionally with a prerelease suffix)."
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

  docker:
    name: Build and push image to GHCR
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: docker/setup-qemu-action@v4.4.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v4.4.1

      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
            type=sha,format=short

      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Package chart, create the release and publish the chart repo
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: azure/setup-helm@v5.1.0

      - name: Configure git
        run: |
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"

      - name: Set chart version and appVersion from the git tag
        run: |
          version="${{ needs.validate.outputs.version }}"
          sed -i -E "s/^version:.*/version: ${version}/; s/^appVersion:.*/appVersion: \"${version}\"/" "${CHART_DIR}/Chart.yaml"
          grep -E '^(version|appVersion):' "${CHART_DIR}/Chart.yaml"

      - name: Package chart
        run: helm package "${CHART_DIR}" --destination _out

      - name: Create the GitHub release on the tag (chart archive attached)
        uses: softprops/action-gh-release@v3.0.4
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: _out/*.tgz
          body: |
            ## Artifacts

            - **Container image**: `ghcr.io/${{ github.repository }}:${{ needs.validate.outputs.version }}` — [GHCR package](https://github.com/${{ github.repository }}/pkgs/container/${{ github.event.repository.name }})
            - **Helm chart**: `.tgz` attached to this release, and published to the GitHub Pages chart repository at `${{ env.CHART_REPO_URL }}` (`index.yaml` at the root of the site)

            Chart `version`/`appVersion` and default `image.tag` for this release: `${{ needs.validate.outputs.version }}`.

      - name: Ensure gh-pages publishing branch exists
        run: |
          if git ls-remote --exit-code --heads origin gh-pages > /dev/null 2>&1; then
            echo "gh-pages branch already exists"
          else
            tree=$(git mktree < /dev/null)
            commit=$(git commit-tree "$tree" -m "chore: initialize gh-pages publishing branch")
            git push origin "$commit:refs/heads/gh-pages"
            echo "gh-pages branch created"
          fi

      - name: Publish chart archive and index.yaml to the gh-pages branch
        run: |
          git fetch origin gh-pages
          git worktree add --detach .gh-pages FETCH_HEAD
          cd .gh-pages
          # Only the chart repository files are managed here: the .tgz archive
          # and index.yaml. The documentation site published at the branch root
          # by docs.yaml is left untouched (docs.yaml preserves index.yaml and
          # *.tgz, and this job never deletes files).
          cp ../_out/*.tgz .
          helm repo index . --url "${CHART_REPO_URL}"
          git add -A
          if git diff --cached --quiet; then
            echo "Chart repository already up to date on gh-pages"
          else
            git commit -m "chore: publish chart ${{ needs.validate.outputs.version }}"
            git push origin HEAD:refs/heads/gh-pages || {
              git fetch origin gh-pages
              git rebase origin/gh-pages
              git push origin HEAD:refs/heads/gh-pages
            }
          fi
