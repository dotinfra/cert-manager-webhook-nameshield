name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build documentation site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v6.0.0
        with:
          python-version: '3.13'

      - name: Install MkDocs
        run: pip install 'mkdocs==1.6.1'

      - name: Build site
        run: mkdocs build --site-dir site

  publish:
    name: Publish docs to the gh-pages branch
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6.0.0
        with:
          python-version: '3.13'

      - name: Install MkDocs
        run: pip install 'mkdocs==1.6.1'

      - name: Build site
        run: mkdocs build --site-dir site

      - name: Configure git
        run: |
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"

      - name: Ensure gh-pages publishing branch exists
        run: |
          if git ls-remote --exit-code --heads origin gh-pages > /dev/null 2>&1; then
            echo "gh-pages branch already exists"
          else
            tree=$(git mktree < /dev/null)
            commit=$(git commit-tree "$tree" -m "chore: initialize gh-pages publishing branch")
            git push origin "$commit:refs/heads/gh-pages"
            echo "gh-pages branch created"
          fi

      - name: Publish docs as the gh-pages home page, alongside the Helm chart
        run: |
          git fetch origin gh-pages
          git worktree add --detach .gh-pages FETCH_HEAD
          cd .gh-pages
          # The site is published at the branch root, so it becomes the GitHub
          # Pages home page (index.html). Only the Helm chart repository files
          # managed by chart-releaser (index.yaml, *.tgz) are preserved, plus
          # the worktree's own .git file.
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name 'index.yaml' ! -name '*.tgz' -exec rm -rf {} +
          cp -r ../site/. .
          touch .nojekyll
          git add -A
          if git diff --cached --quiet; then
            echo "Documentation already up to date on gh-pages"
          else
            git commit -m "docs: publish documentation site"
            git push origin HEAD:refs/heads/gh-pages || {
              git fetch origin gh-pages
              git rebase origin/gh-pages
              git push origin HEAD:refs/heads/gh-pages
            }
          fi
